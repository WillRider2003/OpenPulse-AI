global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    proyecto: "OpenPulse-AI"
    cliente: "Estudio-Contable-Andes-SAC"
    plan_sla: "Profesional-99.5"

scrape_configs:
  - job_name: "uptime-kuma"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["uptime-kuma:3001"]

  - job_name: "openpulse-sla-exporter"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["asterisk:9105"]
        labels:
          frente: "voz-colaboracion-qos"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
