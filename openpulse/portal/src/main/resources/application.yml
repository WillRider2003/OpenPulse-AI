server:
  port: ${PORTAL_PORT:8092}
  address: ${PORTAL_BIND:127.0.0.1}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: OPENPULSE_SESSION
        http-only: true
        same-site: lax
        secure: ${PORTAL_SECURE_COOKIE:false}
spring:
  servlet:
    multipart:
      max-file-size: 24MB
      max-request-size: 25MB
