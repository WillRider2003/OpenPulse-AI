[transport-udp]
type=transport
protocol=udp
tos=cs5
bind=0.0.0.0:5060
external_media_address=10.101.62.44
external_signaling_address=10.101.62.44
external_signaling_port=5070

; ---------- plantillas ----------
[endpoint-base](!)
type=endpoint
context=internos
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=sdes
tos_audio=ef
tos_video=af41

[auth-base](!)
type=auth
auth_type=userpass

[aor-base](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

