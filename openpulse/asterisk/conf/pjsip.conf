; =============================================================================
; OpenPulse AI - Configuracion PJSIP (Asterisk 20 LTS) - Version Final TA3
; Incluye:
;  1. Transporte SIP-UDP (:5060 publicado en :5070) y SIP-TLS (:5061 cifrado)
;  2. Transporte WebRTC WS (:8088) y WSS (:8089)
;  3. Marcado DiffServ (RFC 4594):
;     - Audio RTP/SRTP -> DSCP EF   (46 / 0xB8) + CoS 5
;     - Video WebRTC   -> DSCP AF41 (34 / 0x88) + CoS 4
;     - Senalizacion   -> DSCP CS5  (40 / 0xA0) + CoS 3
;  4. Cifrado de voz SRTP (SDES con soporte optimista para pruebas A/B y SIPp)
; =============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=192.168.35.131
external_signaling_address=192.168.35.131
external_signaling_port=5070
tos=cs5
cos=3

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
external_media_address=192.168.35.131
external_signaling_address=192.168.35.131
external_signaling_port=5061
tos=cs5
cos=3

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
tos=cs5
cos=3

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
tos=cs5
cos=3

; ---------- plantillas ----------
[endpoint-base](!)
type=endpoint
context=internos
disallow=all
allow=ulaw,alaw,opus
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; --- Marcado QoS DiffServ (Leccion 09 y 13) ---
tos_audio=ef
cos_audio=5
tos_video=af41
cos_video=4
; --- Voz cifrada SRTP (Leccion 09 y 12) ---
media_encryption=sdes
media_encryption_optimistic=yes
dtls_Auto_generate_cert=yes

[auth-base](!)
type=auth
auth_type=userpass

[aor-base](!)
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30

