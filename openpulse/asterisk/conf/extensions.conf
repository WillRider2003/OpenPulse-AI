; =============================================================================
; OpenPulse AI - Plan de Marcacion Endurecido (extensions.conf) - TA3
; Mitigacion contra Toll Fraud y enumeracion (Leccion 12):
;  - Solo existe el contexto autenticado [internos]
;  - No existen rutas salientes no autenticadas ni comodines abiertos (_X.)
; =============================================================================

[general]
static=yes
writeprotect=yes
autofallthrough=yes

[default]
; Contexto por defecto bloqueado contra llamadas anonimas (Zero Trust UC)
exten => _.,1,NoOp(BLOQUEO SEGURIDAD: Intento de llamada no autenticada hacia ${EXTEN})
 same => n,Hangup(21)

[internos]
; Llamadas entre extensiones 1001 a 1005 de OpenPulse AI
exten => _100[1-5],1,NoOp(Llamada interna OpenPulse AI de ${CALLERID(num)} a ${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=reporte-rtcp-sla,s,1)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Extension 600: Prueba de eco interactiva (Linphone / Softphone WebRTC)
exten => 600,1,NoOp(Prueba de Eco QoS/SRTP OpenPulse AI)
 same => n,Set(CHANNEL(hangup_handler_push)=reporte-rtcp-sla,s,1)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Extension 700: Sonda automatica para pruebas sinteticas SIPp / MOS (Modelo E)
exten => 700,1,NoOp(Sonda automatica SLA SIPp/MOS OpenPulse AI)
 same => n,Set(CHANNEL(hangup_handler_push)=reporte-rtcp-sla,s,1)
 same => n,Answer()
 same => n,Wait(3)
 same => n,Hangup()

[reporte-rtcp-sla]
exten => s,1,NoOp(=== [SLA-RTCP] Canal=${CHANNEL} | Jitter=${CHANNEL(rtcp,all_jitter)} | Loss=${CHANNEL(rtcp,all_loss)} | RTT=${CHANNEL(rtcp,all_rtt)} ===)
 same => n,Return()
